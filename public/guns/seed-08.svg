<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <rect width="120" height="90" fill="#dee2e4" />
  <g fill="#182026">
    <!-- Heavy-walled barrel & full-length magazine tube -->
    <rect x="16" y="36" width="96" height="6" />
    <rect x="28" y="42" width="84" height="6" />
    <!-- Gold bead front sight -->
    <circle cx="110" cy="34" r="2" fill="#a67c2e" />
    <!-- Receiver -->
    <rect x="14" y="36" width="30" height="13" />
